# yaml-language-server: $schema=../../../schemas/access-level.schema.json

# this is just an example that reflects the FAST core team members' locations
# and needs to be edited, or not referenced in the perimeter variable
conditions:
  - regions:
      - GB # United Kingdom (Primary office)
      - US # United States (Spoke office)
      - BE # Belgium (europe-west1 - Core Cloud Shell VM location)
      - DE # Germany (europe-west3 - Ephemeral Cloud Shell location)
      - NL # Netherlands (europe-west4)
      - IE # Ireland (europe-west2)
      - FI # Finland (europe-north1)
      - FR # France (europe-west9)
      - ES # Spain (europe-south1)
      - IT # Italy (europe-west8)
      - PL # Poland (europe-central2)
      - CH # Switzerland (europe-west6)
      - TW # Taiwan (asia-east1)
      - SG # Singapore (asia-southeast1)
      - CA # Canada (northamerica-northeast1)
