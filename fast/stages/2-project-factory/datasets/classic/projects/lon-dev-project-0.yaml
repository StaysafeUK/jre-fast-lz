# yaml-language-server: $schema=../../../schemas/project.schema.json

name: lon-dev-project-0
parent: $folder_ids:naeu-department/lon-team/lon-nonprod/dev-project

# Enable Compute and network APIs
services:
  - compute.googleapis.com
  - iap.googleapis.com
  - logging.googleapis.com
  - monitoring.googleapis.com

# Connect this project as a Service Project to your Shared VPC host project (net-prod-0)
shared_vpc_service_config:
  host_project: $project_ids:net-prod-0
  network_users:
    - $iam_principals:gcp-devops
    - user:justin@placard.media
