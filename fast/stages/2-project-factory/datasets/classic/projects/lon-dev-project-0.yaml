# yaml-language-server: $schema=../../../schemas/project.schema.json

name: lon-dev-project-0
parent: $folder_ids:naeu-department/lon-team/lon-nonprod/dev-project

# Enable Compute and network APIs
services:
  - compute.googleapis.com
  - iap.googleapis.com
  - logging.googleapis.com
  - monitoring.googleapis.com

# Connect this project as a Service Project to your Shared VPC host project (net-prod-0)
# Uses context-interpolated keys to resolve groups to your active user until Workspace groups are created.
shared_vpc_service_config:
  host_project: $project_ids:net-prod-0
  network_users:
    - $iam_principals:gcp-devops
    - $iam_principals:gcp-organization-admins

# Project-Level IAM Permissions
#
#----------------------------------------------------------------------------
# Fixed Schema Validation: Principal-based mappings must be declared under 
# iam_by_principals. The standard iam block is role-based (roles as keys).
iam_by_principals:
  # Bind your new London developers group key to the GCE/IAP access roles
  "$iam_principals:gcp-lon-dev-vmadmins":
    - roles/compute.instanceAdmin.v1
    - roles/compute.osLogin
    - roles/iap.tunnelResourceAccessor
